services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/fitness-app
      AUTH_KEY: ${X_API_KEY:-local-development-api-key}
      JWT_SECRET: local-only-change-before-deploying
      CORS_ORIGINS: http://localhost:3000,http://localhost:62217
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: development
    environment:
      NODE_ENV: test
      AUTH_KEY: test-api-key
      JWT_SECRET: test-jwt-secret
    command: npm test

volumes:
  mongo_data:
  backend_node_modules:
